# Fly.io 배포 설정. `app` 이름은 전 세계에서 하나뿐이어야 하므로 `fly launch`에서 정한 이름으로 바뀐다.
app = "banwonpoker"
primary_region = "nrt" # 도쿄: 한국에서 가장 가까운 리전

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DATA_DIR = "/data"
  STATIC_DIR = "/app/public"

# 세션 기록(SQLite)과 음성 파일을 둘 디스크. `fly volumes create banwonpoker_data`로 만든다.
[[mounts]]
  source = "banwonpoker_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # 비용을 줄이려고 접속이 없으면 머신을 끄고, 누가 접속하면 다시 켠다.
  # 게임 중에는 WebSocket 연결이 있어 꺼지지 않지만, 모두 나가서 꺼지면 진행 중이던 방은 사라진다.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 500
    hard_limit = 1000

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
