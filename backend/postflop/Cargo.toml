[package]
name = "banwonpoker-postflop"
version = "0.1.0"
edition = "2021"
description = "banwonpoker 헤즈업 포스트플랍 분석: b-inary/postflop-solver를 브라우저(WASM)에서 쓰기 위한 감싸개"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# AGPL-3.0-or-later. 개발이 멈춘 저장소라 커밋을 고정한다. 브라우저에서는 스레드를 쓰지 않으므로 rayon을 끈다.
postflop-solver = { git = "https://github.com/b-inary/postflop-solver", rev = "9d1509f", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
